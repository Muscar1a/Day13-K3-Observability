alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms for 5m
    type: symptom-based
    owner: SRE / On-call
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2% for 5m
    type: symptom-based
    owner: SRE / On-call
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: mean(quality_score) < 0.75 for 5m
    type: symptom-based
    owner: AI Platform / On-call
    runbook: docs/alerts.md#alert-3
