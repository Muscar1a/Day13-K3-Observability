alerts:
  - name: high_latency_p95
    severity: critical
    condition: "p95_latency > 3000ms for 5m"
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: "error_rate > 2.0% for 3m"
    type: symptom-based
    owner: backend-team
    runbook: docs/alerts.md#alert-2
  - name: unexpected_cost_spike
    severity: warning
    condition: "total_cost > 2.50 USD in 60m"
    type: symptom-based
    owner: finops-team
    runbook: docs/alerts.md#alert-3
